name: Deploy

on:
  push:
    branches:
      - stag
      - prod
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'stag' && 'staging' || 'production' }}
    defaults:
      run:
        working-directory: terraform
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'stag' && 'stag' || 'prod' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Build and package Lambdas
        working-directory: .
        run: |
          bun run build
          bun run package:lambdas

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform plan
        run: terraform plan -var="environment=${DEPLOY_ENV}" -var="repo=edge"

