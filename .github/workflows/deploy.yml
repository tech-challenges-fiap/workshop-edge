name: Deploy

on:
  push:
    branches:
      - stag
      - prod
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'stag' && 'staging' || 'production' }}
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'stag' && 'stag' || 'prod' }}
      TF_VAR_app_base_url: ${{ vars.APP_BASE_URL }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_db_host: ${{ vars.DB_HOST }}
      TF_VAR_db_name: ${{ vars.DB_NAME }}
      TF_VAR_db_port: ${{ vars.DB_PORT }}
      TF_VAR_db_secret_arn: ${{ vars.DB_SECRET_ARN }}
      TF_VAR_jwt_secret_arn: ${{ vars.JWT_SECRET_ARN }}
      TF_VAR_lambda_security_group_ids: ${{ vars.LAMBDA_SECURITY_GROUP_IDS_JSON }}
      TF_VAR_notification_webhook_url: ${{ vars.NOTIFICATION_WEBHOOK_URL }}
      TF_VAR_private_subnet_ids: ${{ vars.PRIVATE_SUBNET_IDS_JSON }}
      TF_VAR_create_vpc_endpoints: ${{ vars.CREATE_VPC_ENDPOINTS || 'true' }}
      TF_VAR_repo: edge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and package Lambdas
        run: |
          bun run build
          bun run package:lambdas

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: |
          backend_config="environments/${DEPLOY_ENV}/backend.hcl"

          if [ ! -f "${backend_config}" ]; then
            backend_config="environments/${DEPLOY_ENV}/backend.hcl.example"
          fi

          terraform init -backend-config="${backend_config}"

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_environment: ${{ env.DEPLOY_ENV }}
        run: terraform apply -auto-approve

      - name: Read edge URL
        id: edge
        working-directory: terraform
        run: echo "base_url=$(terraform output -raw api_stage_url)" >> "${GITHUB_OUTPUT}"

      - name: Smoke auth flow
        env:
          EDGE_BASE_URL: ${{ steps.edge.outputs.base_url }}
          SMOKE_CPF: ${{ vars.SMOKE_CPF }}
          SMOKE_PROTECTED_PATH: ${{ vars.SMOKE_PROTECTED_PATH || '/api/work-orders' }}
          SMOKE_SKIP_APP_PROXY: ${{ vars.SMOKE_SKIP_APP_PROXY || 'true' }}
        run: bun run smoke:auth
