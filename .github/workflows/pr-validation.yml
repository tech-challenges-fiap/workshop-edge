name: PR Validation

on:
  pull_request:
    branches:
      - stag
      - prod

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      TF_VAR_app_base_url: ${{ vars.APP_BASE_URL || 'https://workshop-app.example.invalid' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_db_host: ${{ vars.DB_HOST || '' }}
      TF_VAR_db_name: ${{ vars.DB_NAME || 'workshop' }}
      TF_VAR_db_port: ${{ vars.DB_PORT || '5432' }}
      TF_VAR_db_secret_arn: ${{ vars.DB_SECRET_ARN || '' }}
      TF_VAR_environment: stag
      TF_VAR_jwt_secret_arn: ${{ vars.JWT_SECRET_ARN || '' }}
      TF_VAR_lambda_security_group_ids: ${{ vars.LAMBDA_SECURITY_GROUP_IDS_JSON || '[]' }}
      TF_VAR_notification_webhook_url: ${{ vars.NOTIFICATION_WEBHOOK_URL || '' }}
      TF_VAR_private_subnet_ids: ${{ vars.PRIVATE_SUBNET_IDS_JSON || '[]' }}
      TF_VAR_repo: edge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Package
        run: bun run package:lambdas

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -refresh=false
